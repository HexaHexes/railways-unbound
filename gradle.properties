org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=railways_unbound
mod_name=Railways Unbound
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.02
mod_group_id=org.bitwisemadness.railwaysunbound
mod_authors=Bitwise Madness
mod_description=Adds worldgen tuning for Railways Untold: control which dimensions its generated train tracks may appear in, and which biomes they must route around. Does nothing without Railways Untold installed.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.

# Optional dependency pins. The file id is a CurseMaven coordinate; the mod
# version is what that file contains and what the neoforge.mods.toml range is
# built from. Bump both deliberately, together, after re-verifying the mixin
# target and every public hook signature against the new jar (see
# docs/RAILWAYS-UNTOLD.md - the pin is a compatibility contract, not just a
# version number).
railways_untold_file_id=8755353
railways_untold_mod_version=1.2.2
