# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

# Railways Untold interop: the login-bootstrap gate plus the worldgen mixins
# that make stations reachable at every village (angular claim cap, layout
# prediction, structure tags, search gates). All five are server-side logic
# behind requiredMods, so the target classes always exist when they apply.
[[mixins]]
config = "${mod_id}.railwaysuntold.mixins.json"
requiredMods = ["railwaysuntold"]

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Railways Untold - optional. It is the only thing this mod tunes; without it
# every option stays inert, the mixin config below never loads, and no
# registration happens. The version range starts at the pin verified in
# docs/RAILWAYS-UNTOLD.md.
[[dependencies.${mod_id}]]
modId = "railwaysuntold"
type = "optional"
versionRange = "[${railways_untold_mod_version},)"
ordering = "AFTER"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
